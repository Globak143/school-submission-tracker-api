version: '3.8'

services:
  # DynamoDB Local for testing
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: school-tracker-dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    working_dir: /home/dynamodblocal
    volumes:
      - ./dynamodb-data:/home/dynamodblocal/data
    networks:
      - school-tracker-network

  # DynamoDB Admin UI (optional but helpful)
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: school-tracker-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb-local
    networks:
      - school-tracker-network

networks:
  school-tracker-network:
    driver: bridge

# Usage Instructions:
# 1. Start DynamoDB Local: docker-compose up -d
# 2. View tables at: http://localhost:8001
# 3. Create table: python scripts/setup_local_table.py
# 4. Test Lambda: sam local start-api --docker-network school-tracker-network
# 5. Stop containers: docker-compose down