AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: School Submission Tracker API with CSV Upload and DynamoDB History

# Parameters
Parameters:
  SecretName:
    Type: String
    Default: 'school-tracker/api-keys'
    Description: Name of the secret in Secrets Manager containing API keys

Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    MemorySize: 256
    Environment:
      Variables:
        LOG_LEVEL: INFO
        SECRET_NAME: !Ref SecretName
        HISTORY_TABLE_NAME: !Ref SubmissionHistoryTable
        DISABLE_AUTH: "false"

Resources:
  # DynamoDB Table for Submission History (30-day retention)
  SubmissionHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SchoolSubmissionHistory
      BillingMode: PAY_PER_REQUEST  # Auto-scaling, no capacity planning needed
      AttributeDefinitions:
        - AttributeName: check_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: check_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      # Global Secondary Index for querying by date
      GlobalSecondaryIndexes:
        - IndexName: TimestampIndex
          KeySchema:
            - AttributeName: timestamp
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Purpose
          Value: SchoolSubmissionTracking
        - Key: Environment
          Value: Production

  # API Gateway with Throttling and Security
  SchoolTrackerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: SchoolTrackerApi
      StageName: Prod
      TracingEnabled: true
      # Increased limits for file uploads
      BinaryMediaTypes:
        - 'multipart/form-data'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
          MetricsEnabled: true
      # CORS Configuration
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        ApiKeyRequired: false
  
  # Lambda Function
  SchoolTrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SchoolSubmissionTracker
      CodeUri: src/
      Handler: app.lambda_handler
      Description: Tracks school submissions with CSV upload and DynamoDB history
      # IAM Policies
      Policies:
        - Statement:
          - Sid: ReadSecretsManagerSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:school-tracker/api-keys*'
          - Sid: DynamoDBAccess
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !GetAtt SubmissionHistoryTable.Arn
              - !Sub '${SubmissionHistoryTable.Arn}/index/*'
      Events:
        # GET / - API Documentation
        GetApiInfo:
          Type: Api
          Properties:
            RestApiId: !Ref SchoolTrackerApi
            Path: /
            Method: get
        
        # POST /check-submissions - JSON endpoint (backward compatible)
        CheckSubmissions:
          Type: Api
          Properties:
            RestApiId: !Ref SchoolTrackerApi
            Path: /check-submissions
            Method: post
        
        # POST /upload-csv - NEW: CSV file upload endpoint
        UploadCSV:
          Type: Api
          Properties:
            RestApiId: !Ref SchoolTrackerApi
            Path: /upload-csv
            Method: post
        
        # GET /history - NEW: View recent submission checks
        GetHistory:
          Type: Api
          Properties:
            RestApiId: !Ref SchoolTrackerApi
            Path: /history
            Method: get
        
        # OPTIONS for CORS preflight
        OptionsCheckSubmissions:
          Type: Api
          Properties:
            RestApiId: !Ref SchoolTrackerApi
            Path: /check-submissions
            Method: options
        
        OptionsUploadCSV:
          Type: Api
          Properties:
            RestApiId: !Ref SchoolTrackerApi
            Path: /upload-csv
            Method: options
        
        OptionsHistory:
          Type: Api
          Properties:
            RestApiId: !Ref SchoolTrackerApi
            Path: /history
            Method: options

  # CloudWatch Log Group with retention
  SchoolTrackerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SchoolTrackerFunction}'
      RetentionInDays: 7

  # CloudWatch Alarm for high error rate
  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SchoolTracker-HighErrorRate
      AlarmDescription: Alert when error rate is high (possible attack)
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref SchoolTrackerFunction
      TreatMissingData: notBreaching

Outputs:
  SchoolTrackerApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${SchoolTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: SchoolTrackerApiUrl
  
  SchoolTrackerFunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt SchoolTrackerFunction.Arn
    Export:
      Name: SchoolTrackerFunctionArn
  
  DynamoDBTableName:
    Description: "DynamoDB table for submission history"
    Value: !Ref SubmissionHistoryTable
    Export:
      Name: SchoolTrackerHistoryTable
  
  ApiDocumentation:
    Description: "Get API documentation at this endpoint"
    Value: !Sub "https://${SchoolTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  
  CheckSubmissionsEndpoint:
    Description: "POST endpoint to check school submissions (JSON)"
    Value: !Sub "https://${SchoolTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/check-submissions"
  
  UploadCSVEndpoint:
    Description: "POST endpoint to upload CSV file (NEW)"
    Value: !Sub "https://${SchoolTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/upload-csv"
  
  HistoryEndpoint:
    Description: "GET endpoint to view submission history (NEW)"
    Value: !Sub "https://${SchoolTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/history"
  
  SecretNameOutput:
    Description: "Secrets Manager secret name for API keys"
    Value: !Ref SecretName